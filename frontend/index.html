<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>寻迹故宫 · 1.0</title>
<link rel="stylesheet" href="/assets/vendor/leaflet.css" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="is-loading">

<header id="top-bar">
  <div class="top-left">
    <span class="brand">寻迹故宫</span>
    <span class="version-badge">1.0</span>
  </div>
  <div class="top-stats">
    <span id="header-playable">可玩: --</span>
  </div>
  <nav id="report-figure-nav" class="report-figure-nav" style="display:none">
    <button data-figure="1">太和殿</button>
    <button data-figure="2">中和殿</button>
    <button data-figure="3">保和殿</button>
    <button data-figure="4">箭亭</button>
    <button data-figure="5">神武门</button>
    <button data-figure="6">天一门</button>
  </nav>
</header>

<div id="main-layout">
  <div id="left-panel">
    <div id="viewer-frame">
      <div id="krpano_viewer" class="viewer-canvas"></div>
      <div class="viewer-placeholder">全景加载中…</div>
    </div>

    <div id="score-board" class="score-board">
      <div class="score-row">
        <div class="score-cell">
          <span class="score-label">本题</span>
          <span class="score-value" id="score-current">0 / 5000</span>
        </div>
        <div class="score-cell">
          <span class="score-label">题号</span>
          <span class="score-value" id="score-round">0</span>
        </div>
      </div>
      <div class="score-row">
        <div class="score-cell">
          <span class="score-label">累计</span>
          <span class="score-value" id="score-total">0</span>
        </div>
        <div class="score-cell">
          <span class="score-label">平均</span>
          <span class="score-value" id="score-avg">0</span>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button id="submit-guess-btn" class="btn-primary" disabled>提交猜测</button>
    </div>
  </div>

  <div id="right-panel">
    <div id="map-box" class="map-box">
      <div id="mini-map" class="map-canvas"></div>
      <div id="map-placeholder" class="map-placeholder">地图加载中…</div>
      <button id="map-recenter-btn" class="map-recenter-btn" title="重置视图">⌂</button>
    </div>

    <div id="scene-info" class="scene-info">
      <span id="scene-title" class="scene-title">--</span>
      <span id="scene-group" class="scene-group">--</span>
    </div>

    <div id="quiz-zone" class="quiz-zone" style="display:none">
      <div id="season-quiz" class="quiz-card" style="display:none">
        <p class="quiz-question" id="season-question"></p>
        <div class="quiz-options" id="season-options"></div>
      </div>
      <div id="knowledge-quiz" class="quiz-card" style="display:none">
        <p class="quiz-question" id="knowledge-question"></p>
        <div class="quiz-options" id="knowledge-options"></div>
        <p class="quiz-fact" id="knowledge-fact" style="display:none"></p>
      </div>
    </div>

    <button id="next-round-btn" class="btn-primary" style="display:none">下一题</button>
  </div>
</div>

<div id="perfect-toast" class="perfect-toast" style="display:none">
  <span class="perfect-banner">满分定位 · 5000</span>
</div>
<div id="confetti-container" class="perfect-confetti" style="display:none"></div>

<div class="settings-fab" id="settings-fab" title="设置">⚙</div>
<div class="settings-panel" id="settings-panel" style="display:none">
  <h3>资源管理</h3>
  <div class="settings-stats">
    <div><span>全景占用</span><span id="stat-pano-mb">--</span></div>
    <div><span>其它占用</span><span id="stat-other-mb">--</span></div>
    <div><span>合计</span><span id="stat-total-mb">--</span></div>
    <div><span>已缓存</span><span id="stat-playable">--</span></div>
  </div>
  <div class="settings-actions">
    <label>磁盘预算 (MB) <input id="budget-mb" type="number" min="50" value="500" step="10" /></label>
    <button id="btn-prefetch" class="btn-small">预下载 5 景</button>
    <button id="btn-prune-by-mb" class="btn-small btn-danger">按容量清理</button>
    <button id="btn-prune-by-count" class="btn-small btn-danger">保留 10 景清理</button>
    <button id="btn-refresh-usage" class="btn-small">刷新统计</button>
  </div>
</div>

<div id="perfect-map-ring" class="perfect-map-ring" style="display:none"></div>

<script src="/assets/vendor/leaflet.js"></script>
<script src="/assets/viewer/krpano.js"></script>
<script src="/app.js"></script>
</body>
</html>
