<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>寻迹故宫 · 1.0</title>
    <link rel="stylesheet" href="/assets/vendor/leaflet.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Tracing the Forbidden City</p>
          <h1>寻迹故宫</h1>
          <p class="subtitle">观察全景，在地图上标出你的位置。</p>
        </div>
        <div class="hero-stats" id="hero-stats">
          <div class="stat-card">
            <span>可玩场景</span>
            <strong id="scene-count">-</strong>
          </div>
          <div class="stat-card">
            <span>已玩</span>
            <strong id="played-count">0</strong>
          </div>
          <div class="stat-card">
            <span>版本</span>
            <strong id="version-badge">1.0</strong>
          </div>
        </div>
        <nav class="report-figure-nav" id="report-figure-nav">
          <button data-figure="1">太和殿</button>
          <button data-figure="2">中和殿</button>
          <button data-figure="3">保和殿</button>
          <button data-figure="4">箭亭</button>
          <button data-figure="5">神武门</button>
          <button data-figure="6">天一门</button>
        </nav>
      </header>

      <main class="layout">
        <section class="panel viewer-panel">
          <div class="panel-head">
            <div>
              <p class="panel-kicker">360 Viewer</p>
              <h2 id="scene-title">故宫一景</h2>
            </div>
            <div class="viewer-actions">
              <button id="next-round-btn" class="button button-primary" type="button">下一题</button>
            </div>
          </div>

          <div class="viewer-frame" id="viewer-frame">
            <div class="viewer-placeholder">
              <p>正在初始化 360 viewer。</p>
            </div>
            <div id="pannellum-viewer" class="viewer-canvas"></div>
          </div>

          <div class="score-board" id="score-board">
            <div class="score-cell">
              <span class="score-label">本题</span>
              <span class="score-value" id="score-current">0 / 5000</span>
            </div>
            <div class="score-cell">
              <span class="score-label">题号</span>
              <span class="score-value" id="score-round">0</span>
            </div>
            <div class="score-cell">
              <span class="score-label">累计</span>
              <span class="score-value" id="score-total">0</span>
            </div>
            <div class="score-cell">
              <span class="score-label">平均</span>
              <span class="score-value" id="score-avg">0</span>
            </div>
          </div>

        </section>

        <aside class="panel map-panel">
          <div class="panel-head">
            <div>
              <p class="panel-kicker">宫图定位</p>
              <h2>点击地图，估计位置</h2>
            </div>
            <div class="viewer-actions">
              <button id="map-recenter-btn" class="button" type="button">回中</button>
              <button id="submit-guess-btn" class="button button-primary" type="button" disabled>提交猜测</button>
            </div>
          </div>

          <div class="map-box">
            <div class="map-placeholder" id="map-placeholder">
              <p>宫图初始化中...</p>
            </div>
            <div id="mini-map" class="map-canvas"></div>
          </div>

          <div class="details-grid compact">
            <div class="detail-card">
              <span>本题得分</span>
              <strong id="guess-score">-</strong>
            </div>
          </div>

          <div class="quiz-zone" id="quiz-zone" style="display:none">
            <div class="quiz-card" id="season-quiz" style="display:none">
              <p class="quiz-question" id="season-question"></p>
              <div class="quiz-options" id="season-options"></div>
            </div>
            <div class="quiz-card" id="knowledge-quiz" style="display:none">
              <p class="quiz-question" id="knowledge-question"></p>
              <div class="quiz-options" id="knowledge-options"></div>
            </div>
          </div>

        </aside>
      </main>
    </div>

    <div id="perfect-toast" class="perfect-toast" style="display:none"><span class="perfect-banner">满分定位 · 5000</span></div>
    <div id="confetti-container" class="perfect-confetti" style="display:none"></div>

    <!-- 锚点采集模式面板 -->
    <div class="debug-anchor-bar" id="debug-anchor-bar" style="display:none">
      <span class="debug-badge">🎯 锚点采集模式</span>
      <select id="debug-scene-select" class="debug-scene-select">
        <option value="">-- 选择场景 --</option>
      </select>
      <span class="debug-status" id="debug-anchor-status">--</span>
      <button id="debug-reload-btn" class="btn-small" type="button">刷新列表</button>
      <span class="debug-stats" id="debug-anchor-stats"></span>
    </div>

    <div class="settings-fab" id="settings-fab" title="设置">⚙</div>
    <div class="settings-panel" id="settings-panel" style="display:none">
      <h3>资源管理</h3>
      <div class="settings-stats">
        <div><span>全景占用</span><span id="stat-pano-mb">--</span></div>
        <div><span>其它占用</span><span id="stat-other-mb">--</span></div>
        <div><span>合计</span><span id="stat-total-mb">--</span></div>
        <div><span>已缓存/未玩</span><span id="stat-playable">--</span></div>
        <div><span>已玩</span><span id="stat-played">--</span></div>
      </div>
      <div class="settings-actions">
        <label>下载模式
          <select id="download-mode-select">
            <option value="manual">不自动下载</option>
            <option value="lazy">懒下载</option>
          </select>
        </label>
        <label>磁盘预算(MB) <input id="budget-mb" type="number" min="50" value="500" step="10"></label>
        <button id="btn-prefetch" class="btn-small">预下载 5 景</button>
        <button id="btn-prune-by-mb" class="btn-small btn-danger">按容量清理</button>
        <button id="btn-refresh-usage" class="btn-small">刷新统计</button>
      </div>
    </div>

    <script src="/assets/vendor/leaflet.js"></script>
    <script src="/assets/vendor/krpano.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
